[build]
  publish = "src/"

[functions]
  directory = "src/netlify/functions"

# Clean URLs - removes .html from addresses
[build.processing.html]
  pretty_urls = true

# API routes → Netlify Functions
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/prayer"
  to = "/.netlify/functions/prayer"
  status = 200

[[redirects]]
  from = "/api/stay-updated"
  to = "/.netlify/functions/stay-updated"
  status = 200

# Photos uploaded through the admin panel live in Supabase Storage, not in this git repo —
# this makes them resolve at the same christchurchbluffton.org/a34317d8/ URL as the images
# that ARE real files here. Netlify checks for a real static file at the exact path first;
# this proxy only kicks in when nothing local matches, so the existing real files are
# completely unaffected.
[[redirects]]
  from = "/a34317d8/*"
  to = "https://fhktlrbadddmhrijhjwa.supabase.co/storage/v1/object/public/photos/:splat"
  status = 200

# Legacy redirects
[[redirects]]
  from = "/donation"
  to = "/"
  status = 301

[[redirects]]
  from = "/coming-soon"
  to = "/"
  status = 301

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers - all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://give.tithe.ly\")"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com https://fhktlrbadddmhrijhjwa.supabase.co; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://challenges.cloudflare.com https://fhktlrbadddmhrijhjwa.supabase.co; frame-src 'self' https://give.tithe.ly https://tithe.ly https://challenges.cloudflare.com https://www.google.com; frame-ancestors 'self' https://forgeddigitaldesign.com http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-XSS-Protection = "1; mode=block"

# Cache CSS/JS - filenames aren't hashed, so a long immutable cache
# strands returning visitors on stale assets after a deploy
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images also get overwritten in place under the same filename
# (e.g. ministry photos), so keep this short rather than immutable
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache HTML - short cache with revalidation
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Admin panel — internal tool, never meant to be crawled or indexed
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
