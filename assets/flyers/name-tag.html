<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christ Church Bluffton — Name Tag</title>
    <link rel="stylesheet" href="../live/css/fonts.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Lora', serif;
        }

        .branding {
            width: 600px;
            height: 450px;
            background: #FFFFFF;
            border: 7px solid #303b6a;
            outline: 5px solid #c3a355;
            outline-offset: -12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            padding: 20px 40px;
        }

        .logo {
            width: 88px;
            height: 88px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 16px;
        }

        .church-name {
            font-size: 1.4rem;
            font-weight: 400;
            color: #303b6a;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .church-location {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #c3a355;
            margin-bottom: 24px;
        }

        .person-name {
            font-size: 2.4rem;
            font-weight: 400;
            color: #303b6a;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .person-section {
            margin-top: auto;
            margin-bottom: auto;
            position: relative;
            top: -45px;
            text-align: center;
        }

        .person-role {
            font-size: 1.54rem;
            color: #c3a355;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .church-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: auto;
        }

        .church-header-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 50%;
        }

        .church-header-name {
            font-size: 1.4rem;
            color: #303b6a;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .church-header-location {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c3a355;
        }

        .church-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .church-footer-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            border-radius: 50%;
        }

        .church-footer-name {
            font-size: 0.9rem;
            color: #303b6a;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .church-footer-location {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c3a355;
        }
    </style>
</head>
<body>
    <div class="branding">
        <div class="church-header">
            <img src="../assets/logos/logo-white-bg.png" alt="Christ Church Bluffton" class="church-header-logo" width="65" height="65">
            <span class="church-header-name">Christ Church<span class="church-header-location">Bluffton</span></span>
        </div>
        <div class="person-section">
            <div class="person-name">Stephanie McCartney</div>
            <div class="person-role">Greeter</div>
        </div>
    </div>
</body>
</html>
