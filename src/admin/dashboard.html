<style>
  .dashboard-grid { max-width: 1180px; margin: 0 auto; }
  .stat-card { text-decoration: none; display: block; transition: box-shadow 0.15s ease, transform 0.15s ease; }
  a.stat-card:hover { box-shadow: 0 8px 22px rgba(48,59,106,0.12); transform: translateY(-1px); }
  .stat-card .stat-empty { font-size: 13px; color: var(--text-muted); }
  /* Event titles are text, not a number — the shared .stat-value size (30px) is tuned for
     short counts and wraps badly on a full event name. Only this card needs the override. */
  .stat-card.text-stat .stat-value { font-size: 18px; line-height: 1.35; }

  .activity-card { margin-top: 22px; }
  .activity-card .card-body { padding: 0; }
  .activity-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 22px;
    background: linear-gradient(135deg, rgba(195,163,85,0.12) 0%, rgba(195,163,85,0.04) 100%);
    border-bottom: 2px solid var(--gold);
  }
  .activity-title { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; color: var(--navy-blue); }
  .activity-list { list-style: none; margin: 0; padding: 0; }
  .activity-list li {
    padding: 12px 22px;
    border-bottom: 1px solid var(--border-gray);
    font-size: 13px;
    color: var(--text-dark);
    display: flex; justify-content: space-between; gap: 12px;
  }
  .activity-list li:last-child { border-bottom: none; }
  .activity-list .activity-when { color: var(--text-muted); white-space: nowrap; }
  .activity-empty { padding: 18px 22px; font-size: 13px; color: var(--text-muted); }
  .activity-more { padding: 14px 22px; text-align: center; border-top: 1px solid var(--border-gray); }
  .activity-more-btn {
    background: none; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--navy-blue);
    padding: 6px 14px; border-radius: 6px;
  }
  .activity-more-btn:hover { background: rgba(195,163,85,0.12); }
</style>

  </div>
    <div class="main">
      <div class="topbar">
        <div>
          <h1>Dashboard</h1>
          <div class="subtitle" id="dash-subtitle">Welcome back</div>
        </div>
      </div>
      <div class="content" id="page-body">
        <div class="stat-grid dashboard-grid" id="stat-grid"></div>
        <div class="card activity-card" id="activity-card" style="display:none;">
          <div class="activity-head">
            <div class="activity-title">Recent Activity</div>
          </div>
          <div class="card-body">

            <div class="activity-more" id="activity-more" style="display:none;">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/shared.js"></script>
  <script>
    function escapeHtml(str) {
      return (str || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function todayMidnight() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }

    // Same recurrence math as events.html — kept self-contained per this app's page-independence
    // convention rather than shared, since only this card needs a single "what's next" answer.
    function nextOccurrence(ev) {
      const today = todayMidnight();
      const start = new Date(ev.start_date + 'T00:00:00');
      if (ev.repeat === 'none' || !ev.repeat) {
        const effectiveEnd = ev.end_date ? new Date(ev.end_date + 'T00:00:00') : start;
        return effectiveEnd >= today ? start : null;
      }
      const until = ev.repeat_until ? new Date(ev.repeat_until + 'T00:00:00') : null;
      if (until && until < today) return null;
      if (start >= today) return start;

      let cursor = new Date(start);
      if (ev.repeat === 'daily') {
        const diffDays = Math.ceil((today - start) / 86400000);
        cursor.setDate(cursor.getDate() + diffDays);
      } else if (ev.repeat === 'weekly') {
        const diffDays = Math.ceil((today - start) / 86400000);
        const weeks = Math.ceil(diffDays / 7);
        cursor.setDate(cursor.getDate() + weeks * 7);
      } else if (ev.repeat === 'monthly') {
        while (cursor < today) cursor.setMonth(cursor.getMonth() + 1);
      }
      if (until && cursor > until) return null;
      return cursor;
    }

    function formatCardDate(d) {
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    async function nextEventCard() {
      const { data, error } = await supabaseClient.from('events').select('*');
      if (error || !data || data.length === 0) {
        return { label: 'Next Upcoming Event', value: '—', hint: 'Nothing scheduled', href: 'events.html', textStat: true };
      }
      let soonest = null;
      data.forEach(ev => {
        const occ = nextOccurrence(ev);
        if (occ && (!soonest || occ < soonest.date)) soonest = { date: occ, ev };
      });
      if (!soonest) return { label: 'Next Upcoming Event', value: '—', hint: 'Nothing scheduled', href: 'events.html', textStat: true };
      return { label: 'Next Upcoming Event', value: soonest.ev.title, hint: formatCardDate(soonest.date), href: 'events.html', textStat: true };
    }

    async function activePrayersCard() {
      const { count } = await supabaseClient.from('prayer_requests').select('id', { count: 'exact', head: true }).eq('status', 'active');
      return { label: 'Open Prayer Requests', value: String(count || 0), hint: 'Active', href: 'prayers.html' };
    }

    async function newSubscribersCard() {
      const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString();
      const { count } = await supabaseClient.from('subscribers').select('id', { count: 'exact', head: true }).gte('added_at', weekAgo);
      return { label: 'New Subscribers', value: String(count || 0), hint: 'Last 7 days', href: 'subscribers.html' };
    }

    async function congregantFamiliesCard() {
      const { count } = await supabaseClient.from('congregant_families').select('id', { count: 'exact', head: true });
      return { label: 'Congregant Families', value: String(count || 0), hint: 'On file', href: 'congregants.html' };
    }

    async function pendingInvitesCard() {
      const { count } = await supabaseClient.from('profiles').select('id', { count: 'exact', head: true }).eq('status', 'invited');
      return { label: 'Pending Team Invites', value: String(count || 0), hint: "Haven't signed in yet", href: 'team.html' };
    }

    function statCardHtml(card) {
      return `
        <a class="stat-card${card.textStat ? ' text-stat' : ''}" href="${escapeHtml(card.href)}">
          <div class="stat-label">${escapeHtml(card.label)}</div>
          <div class="stat-value">${escapeHtml(card.value)}</div>
          <div class="stat-hint">${escapeHtml(card.hint)}</div>
        </a>`;
    }

    // Starts at the 12 most recent entries; each "Load 10 more" click reveals 10 older
    // ones from the same already-fetched log (no extra round-trip per click).
    let activityLog = [];
    let activityShown = 0;

    function renderActivity(log) {
      activityLog = log;
      activityShown = Math.min(12, log.length);
      renderActivityList();
    }

    function renderActivityList() {
      const list = document.getElementById('activity-list');
      const more = document.getElementById('activity-more');
      const recent = activityLog.slice(-activityShown).reverse();
      if (recent.length === 0) {
        list.innerHTML = `<li class="activity-empty">No activity logged yet.</li>`;
        more.style.display = 'none';
        return;
      }
      list.innerHTML = recent.map(e => `
        <li>
          <span>${escapeHtml(ACTIVITY_LABELS[e.action] || e.action)}${e.target ? ' — ' + escapeHtml(e.target) : ''} <span style="color:var(--text-muted);">(${escapeHtml(e.actor)})</span></span>
          <span class="activity-when">${escapeHtml(new Date(e.t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</span>
        </li>`).join('');
      more.style.display = activityShown < activityLog.length ? '' : 'none';
    }

    document.getElementById('activity-more-btn').addEventListener('click', () => {
      activityShown = Math.min(activityShown + 10, activityLog.length);
      renderActivityList();
    });

    // Fired immediately, in parallel with loadSidebar()'s session check — this is the
    // landing page everyone hits after login, so it's the highest-value place to not
    // make people wait for permissions to resolve before the actual queries even start.
    // None of these card builders touch the session; RLS on each table already decides
    // what a given person can actually see, so firing all of them unconditionally (even
    // for cards that turn out unused because of a permission check below) is harmless.
    const allCardPromises = {
      events: nextEventCard(),
      prayers: activePrayersCard(),
      subscribers: newSubscribersCard(),
      congregants: congregantFamiliesCard(),
      pendingInvites: pendingInvitesCard()
    };
    const activityLogPromise = getActivityLog();

    loadSidebar().then(async () => {
      const session = getSession();
      if (!session) return;
      document.getElementById('dash-subtitle').textContent = `Welcome back, ${session.name}`;

      const cardKeys = [];
      if (hasPermission(session, 'events')) cardKeys.push('events');
      if (hasPermission(session, 'prayers')) cardKeys.push('prayers');
      if (hasPermission(session, 'subscribers')) cardKeys.push('subscribers');
      if (hasPermission(session, 'congregants')) cardKeys.push('congregants');
      if (isAdminTier(session)) cardKeys.push('pendingInvites');

      const grid = document.getElementById('stat-grid');
      if (cardKeys.length === 0) {
        grid.innerHTML = `<div class="stat-card"><div class="stat-empty">Nothing to show yet — ask an admin to turn on access to a page for your account.</div></div>`;
      } else {
        const cards = await Promise.all(cardKeys.map(k => allCardPromises[k]));
        grid.innerHTML = cards.map(statCardHtml).join('');
      }

      if (isAdminTier(session)) {
        document.getElementById('activity-card').style.display = '';
        const log = await activityLogPromise;
        renderActivity(log);
      }
    });
  </script>
