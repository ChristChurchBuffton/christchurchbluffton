<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Email Images — Christ Church Bluffton</title>
<style>
  :root {
    --navy-blue: #303b6a;
    --gold: #c3a355;
    --lightest-gray: #F5F4EF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background-color: var(--lightest-gray);
    color: #333;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header {
    background-color: var(--navy-blue);
    color: var(--white);
    padding: 24px 28px;
    border-radius: 10px;
    margin-bottom: 28px;
  }
  header .label {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #A9B3D6;
    margin-bottom: 6px;
  }
  header h1 { margin: 0; font-size: 24px; font-weight: normal; color: #FFFFFF; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
  }
  .card {
    background: var(--white);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(48,59,106,0.08);
  }
  .card a { display: block; }
  .card img {
    width: 100%;
    height: 220px;
    object-fit: contain;
    background: var(--lightest-gray);
    display: block;
  }
  .card .hint {
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    color: #999;
    padding: 8px 0 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="label">Christ Church Bluffton</div>
      <h1>Email Flyer Images</h1>
    </header>
    <div class="grid">
      <div class="card">
        <a href="church-commitments.jpg" target="_blank"><img src="church-commitments.jpg" alt="Building His Kingdom Together — Our Commitments"></a>
        <div class="hint">Click to open</div>
      </div>
      <div class="card">
        <a href="ministry-opportunities.jpg" target="_blank"><img src="ministry-opportunities.jpg" alt="Ministry Opportunities of Christ Church Bluffton"></a>
        <div class="hint">Click to open</div>
      </div>
      <div class="card">
        <a href="worship-service-communion.jpg" target="_blank"><img src="worship-service-communion.jpg" alt="Worship Service with Communion — Saturdays 5:30pm"></a>
        <div class="hint">Click to open</div>
      </div>
      <div class="card">
        <a href="knowing-jesus-sharing-life-bringing-hope.jpg" target="_blank"><img src="knowing-jesus-sharing-life-bringing-hope.jpg" alt="Knowing Jesus, Sharing Life, Bringing Hope"></a>
        <div class="hint">Click to open</div>
      </div>
    </div>
  </div>
</body>
</html>
